[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy-assistant"
version = "0.1.0"
description = "Reachy Mini lab assistant built around the OpenAI Realtime API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bachelor group 16" }]
dependencies = [
  "numpy",
  "openai",
  "openwakeword",
  "qdrant-client",
  "reachy_mini",
  "reachy_mini_motor_controller",
  "reachy_mini_rust_kinematics",
  "scipy",
  "sounddevice",
  "websockets",
]

[project.scripts]
reachy-assistant = "reachy_assistant.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "mypy>=1.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
